server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # The proxy speaks HTTP to this container. An absolute slash redirect
    # would advertise http:// and fail the HTTPS best-practices audit.
    absolute_redirect off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Astro emits /page/index.html. Serve it at /page with no redirect.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
